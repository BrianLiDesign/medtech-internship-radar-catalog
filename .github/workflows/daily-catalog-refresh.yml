name: Daily catalog refresh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scrape, validate, archive, and generate README
        run: python scripts/refresh_catalog.py

      - name: Commit refresh branch
        id: commit
        env:
          REFRESH_BRANCH: automation/daily-catalog-refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REFRESH_BRANCH"
          git add data/active/internships.json data/archived/internships.json data/health.json README.md README-Inactive.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): refresh internship catalog"
          git push --force-with-lease origin "HEAD:$REFRESH_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        id: pull-request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REFRESH_BRANCH: automation/daily-catalog-refresh
        run: |
          find_open_pr() {
            gh pr list \
              --head "$REFRESH_BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          }

          pr_number=$(find_open_pr)

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(data): refresh internship catalog" \
              --body "Automated catalog refresh (scrape → validate → archive → generate README). CI on this PR runs tests with mocked HTTP."
          else
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "chore(data): refresh internship catalog" \
              --body "Automated catalog refresh (scrape → validate → archive → generate README). CI on this PR runs tests with mocked HTTP."
            pr_number=$(find_open_pr)
          fi

          if [ -z "$pr_number" ]; then
            echo "Unable to resolve the open refresh pull request" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run CI on the refresh commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REFRESH_BRANCH: automation/daily-catalog-refresh
          REFRESH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref "$REFRESH_BRANCH"

          run_id=""
          for attempt in {1..30}; do
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$REFRESH_BRANCH" \
              --event workflow_dispatch \
              --commit "$REFRESH_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "Unable to find the dispatched CI run for $REFRESH_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Merge validated refresh
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REFRESH_SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          gh pr merge "$PR_NUMBER"
          --squash
          --delete-branch
          --match-head-commit "$REFRESH_SHA"
