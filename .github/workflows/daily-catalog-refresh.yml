name: Daily catalog refresh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scrape, validate, archive, and generate README
        run: python scripts/refresh_catalog.py

      - name: Commit refresh branch
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/daily-catalog-refresh
          git add data/active/internships.json data/archived/internships.json data/health.json README.md README-Inactive.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): refresh internship catalog"
          git push --force-with-lease origin HEAD:automation/daily-catalog-refresh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh pr view automation/daily-catalog-refresh --json url >/dev/null 2>&1; then
            gh pr edit automation/daily-catalog-refresh \
              --title "chore(data): refresh internship catalog" \
              --body "Automated catalog refresh (scrape → validate → archive → generate README). CI on this PR runs tests with mocked HTTP."
          else
            gh pr create \
              --base main \
              --head automation/daily-catalog-refresh \
              --title "chore(data): refresh internship catalog" \
              --body "Automated catalog refresh (scrape → validate → archive → generate README). CI on this PR runs tests with mocked HTTP."
          fi
